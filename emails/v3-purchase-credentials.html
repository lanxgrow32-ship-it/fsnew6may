
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Credentials — FundedStock</title>
</head>
<body style="font-family: sans-serif; background-color: #f8fafc; padding: 40px; color: #1e293b;">
    <div style="max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0;">
        <div style="background: #7c3aed; padding: 30px; text-align: center; color: white;">
            <h1 style="margin: 0; font-size: 24px;">Your Trading Credentials</h1>
        </div>
        <div style="padding: 40px;">
            <p>Hi {{full_name}},</p>
            <p>Your <b>{{plan_name}}</b> is ready for execution. Use the details below to log in to the terminal.</p>
            <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin: 30px 0;">
                <p style="margin: 0; font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold;">Login ID</p>
                <p style="margin: 5px 0 15px; font-family: monospace; font-size: 18px; color: #1e293b;">{{username}}</p>
                <p style="margin: 0; font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold;">Password</p>
                <p style="margin: 5px 0 0; font-family: monospace; font-size: 18px; color: #1e293b;">{{password}}</p>
            </div>
            <div style="text-align: center;">
                <a href="https://stockmint.io/login" style="display: inline-block; background: #7c3aed; color: white; padding: 14px 30px; text-decoration: none; border-radius: 8px; font-weight: bold;">Launch Terminal</a>
            </div>
        </div>
    </div>
</body>
</html>
